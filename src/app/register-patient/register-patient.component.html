<section class="register-card">
  <h2>Registrar Paciente</h2>
  <label>Tipo de documento</label>
  <input [(ngModel)]="tipoDocumento" placeholder="Tipo de documento" />
  <label>Número de documento</label>
  <input [(ngModel)]="numeroDocumento" placeholder="Número de documento" />
  <label>Nombre completo</label>
  <input [(ngModel)]="nombre" placeholder="Nombre del paciente" />

  <label>ID del paciente</label>
  <input [(ngModel)]="id" placeholder="ID único" />

  <div class="actions">
    <button (click)="submit()" class="btn-save">Guardar</button>
  </div>

  <p class="msg" *ngIf="mensaje">{{ mensaje }}</p>
</section>
