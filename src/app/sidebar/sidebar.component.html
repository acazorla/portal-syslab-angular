<aside class="sidebar" [class.expanded]="isExpanded()">
  <div class="sidebar-header">
    <button class="toggle-btn" (click)="toggleSidebar()" aria-label="Abrir/Cerrar menú">
      ☰
    </button>
    @if (isExpanded()) {
      <span class="sidebar-title">Menú</span>
    }
  </div>

  <nav class="sidebar-nav">
    <ul class="menu-list">
      @for (item of filteredMenuItems(); track item.label) {
        <li class="menu-item">
          <button 
            class="menu-link" 
            (click)="handleMenuClick(item)"
            [class.active]="expandedMenu() === item.label"
            [attr.aria-expanded]="expandedMenu() === item.label"
          >
            <span class="menu-icon">{{ item.icon }}</span>
            @if (isExpanded()) {
              <span class="menu-label">{{ item.label }}</span>
            }
            @if (item.submenu && isExpanded()) {
              <span class="menu-arrow">▼</span>
            }
          </button>

          @if (item.submenu && expandedMenu() === item.label && isExpanded()) {
            <ul class="submenu">
              @for (subitem of item.submenu; track subitem.label) {
                <li class="submenu-item">
                  <button 
                    class="submenu-link"
                    (click)="handleSubmenuClick(subitem.action, $event)"
                  >
                    {{ subitem.label }}
                  </button>
                </li>
              }
            </ul>
          }
        </li>
      }
    </ul>
  </nav>
</aside>

@if (isExpanded()) {
  <div class="sidebar-overlay" (click)="toggleSidebar()"></div>
}
